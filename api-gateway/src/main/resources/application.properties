spring.application.name=api-gateway
server.port=8090

# Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# Routes
spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.routes[0].id=produits-service

spring.cloud.gateway.routes[0].uri=lb://produits-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/produits/**,/api/categories/**

spring.cloud.gateway.routes[1].id=avis-service
spring.cloud.gateway.routes[1].uri=lb://avis-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/avis/**
